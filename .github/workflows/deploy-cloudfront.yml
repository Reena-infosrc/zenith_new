name: Deploy CloudFront Distribution

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      domain_bucket:
        description: 'S3 Bucket Domain'
        required: true
        default: 'zenith-hr-staging.apps.infoservices.com'

jobs:
  deploy-cloudfront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CloudFormation Stack for CloudFront
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          DOMAIN_BUCKET="${{ inputs.domain_bucket }}"
          STACK_NAME="zenith-hr-frontend-${STAGE}"

          echo "Deploying CloudFormation stack: $STACK_NAME..."
          aws cloudformation deploy \
            --template-file backend/cloudfront-frontend.yml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
                Stage="$STAGE" \
                DomainBucketName="$DOMAIN_BUCKET" \
            --capabilities CAPABILITY_IAM \
            --region "${{ secrets.AWS_REGION }}"

          echo "Fetching outputs..."
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          DOMAIN_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text)

          echo "=========================================================="
          echo "  CloudFront Distribution ID : $DIST_ID"
          echo "  CloudFront Domain Name     : https://$DOMAIN_NAME"
          echo "=========================================================="
