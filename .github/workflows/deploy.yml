name: Zenith HR Pulse â€“ Deploy

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - branch: staging
            stage: staging
            env_file: .env.staging
            ecr_repo_secret: ECR_REPO_STAGING
            api_base_secret: ZENITH_API_BASE_STAGING
            s3_bucket_secret: S3_BUCKET_STAGING
            cloudfront_secret: CLOUDFRONT_DISTRIBUTION_ID_STAGING
            ecr_account_secret: ECR_ACCOUNT_STAGING
            security_secret_key_secret: SECURITY_SECRET_KEY_STAGING
            # Staging: proxy /api/* through CloudFront so the browser makes
            # same-origin requests â€” no CORS preflight needed.
            cloudfront_api_proxy: "false"
            vite_api_base: "https://zenith-api.apps.infoservices.com"
          - branch: main
            stage: prod
            env_file: .env.prod
            ecr_repo_secret: ECR_REPO_PROD
            api_base_secret: ZENITH_API_BASE_PROD
            s3_bucket_secret: S3_BUCKET_PROD
            cloudfront_secret: CLOUDFRONT_DISTRIBUTION_ID_PROD
            ecr_account_secret: ECR_ACCOUNT_PROD
            security_secret_key_secret: SECURITY_SECRET_KEY
            cloudfront_api_proxy: "false"
            vite_api_base: ""

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      STAGE: ${{ matrix.stage }}

    steps:
      - name: Checkout repository
        if: matrix.branch == github.ref_name
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        if: matrix.branch == github.ref_name
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node.js
        if: matrix.branch == github.ref_name
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Global `npm install -g serverless@3` often fails on ubuntu-latest (npm 10+ / permissions).
      # Local `npm ci` in backend/ is reliable; API Docker image ignores these files (.dockerignore).
      - name: Install Serverless Framework
        if: matrix.branch == github.ref_name
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm ci --no-audit --no-fund

      - name: Check if serverless.yml or env file changed
        if: matrix.branch == github.ref_name
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git log -1 --name-only --pretty="")
          ENV_FILE="backend/${{ matrix.env_file }}"

          if echo "$CHANGED_FILES" | grep -qE 'backend/serverless\.yml|'"$ENV_FILE" || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "DEPLOY_SERVERLESS=true" >> $GITHUB_ENV
            echo "Serverless config or env file changed. DEPLOY_SERVERLESS=true"
          else
            echo "DEPLOY_SERVERLESS=false" >> $GITHUB_ENV
            echo "No changes in serverless.yml or $ENV_FILE. DEPLOY_SERVERLESS=false"
          fi

      - name: Check and create ECR repository
        if: matrix.branch == github.ref_name
        env:
          ECR_ACCOUNT: ${{ secrets[matrix.ecr_account_secret] }}
          ECR_REPO: ${{ secrets[matrix.ecr_repo_secret] }}
        run: |
          REPO_EXISTS=$(aws ecr describe-repositories --repository-names $ECR_REPO --region $AWS_REGION 2>/dev/null | grep -c "repositoryArn" || echo 0)
          
          if [ "$REPO_EXISTS" = "0" ]; then
            echo "ECR repository does not exist. Creating: $ECR_REPO"
            aws ecr create-repository \
              --repository-name $ECR_REPO \
              --region $AWS_REGION \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES
            echo "ECR repository created successfully"
          else
            echo "ECR repository already exist: $ECR_REPO"
          fi

      - name: Build and push Docker image
        if: matrix.branch == github.ref_name
        env:
          ECR_ACCOUNT: ${{ secrets[matrix.ecr_account_secret] }}
          ECR_REPO: ${{ secrets[matrix.ecr_repo_secret] }}
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com
          
          cd backend
          IMAGE_URI="$ECR_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest"
          
          echo "Building Docker image with BuildKit..."
          DOCKER_BUILDKIT=1 docker build \
            --no-cache \
            -t ${IMAGE_URI} \
            .
          
          echo "Pushing images..."
          docker push ${IMAGE_URI}
          
          echo "ECR_IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Load environment variables
        if: matrix.branch == github.ref_name
        env:
          AZURE_MSAL_CLIENT_ID: ${{ secrets.AZURE_MSAL_CLIENT_ID }}
          AZURE_MSAL_TENANT_ID: ${{ secrets.AZURE_MSAL_TENANT_ID }}
        run: |
          cd backend
          if [ "${{ matrix.stage }}" = "staging" ]; then
            grep -E '^[A-Za-z0-9_]+=' .env.staging >> $GITHUB_ENV
          else
            grep -E '^[A-Za-z0-9_]+=' .env.prod >> $GITHUB_ENV
          fi
          
          # Ensure MSAL validation env vars are present for backend
          echo "AZURE_MSAL_CLIENT_ID=${AZURE_MSAL_CLIENT_ID}" >> $GITHUB_ENV
          echo "AZURE_MSAL_TENANT_ID=${AZURE_MSAL_TENANT_ID}" >> $GITHUB_ENV

      - name: Deploy with Serverless Framework (if serverless.yml changed)
        if: matrix.branch == github.ref_name && env.DEPLOY_SERVERLESS == 'true'
        run: |
          cd backend
          if ! npx serverless deploy --stage "$STAGE"; then
            echo "::warning::Serverless deploy failed (e.g. AWS::EarlyValidation::ResourceExistenceCheck because resources already exist). Continuing with container and frontend deployment."
          fi
        env:
          ECR_IMAGE_URI: ${{ env.ECR_IMAGE_URI }}
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SECURITY_SECRET_KEY: ${{ secrets[matrix.security_secret_key_secret] }}
          AZURE_MSAL_CLIENT_ID: ${{ secrets.AZURE_MSAL_CLIENT_ID }}
          AZURE_MSAL_TENANT_ID: ${{ secrets.AZURE_MSAL_TENANT_ID }}
          APP_OWNER: ${{ secrets.APP_OWNER }}
          INFRA_OWNER: ${{ secrets.INFRA_OWNER }}
          DYNAMODB_FIELD_ENCRYPTION_ENABLED: ${{ env.DYNAMODB_FIELD_ENCRYPTION_ENABLED }}
          DYNAMODB_FIELD_ENCRYPTION_KMS_KEY_ARN: ${{ env.DYNAMODB_FIELD_ENCRYPTION_KMS_KEY_ARN }}
          DYNAMODB_FIELD_ENCRYPTION_KMS_KEY_ARN_V2: ${{ env.DYNAMODB_FIELD_ENCRYPTION_KMS_KEY_ARN_V2 }}
          DYNAMODB_FIELD_ENCRYPTION_VERSION: ${{ env.DYNAMODB_FIELD_ENCRYPTION_VERSION }}
          DYNAMODB_FIELD_ENCRYPTION_COMPRESS: ${{ env.DYNAMODB_FIELD_ENCRYPTION_COMPRESS }}
          DYNAMODB_FIELD_ENCRYPTION_DECRYPT_ON_READ: ${{ env.DYNAMODB_FIELD_ENCRYPTION_DECRYPT_ON_READ }}
          DYNAMODB_FIELD_ENCRYPTION_CONTEXT_APP: ${{ env.DYNAMODB_FIELD_ENCRYPTION_CONTEXT_APP }}
          DYNAMODB_FIELD_ENCRYPTION_ALLOWLIST_FILE: ${{ env.DYNAMODB_FIELD_ENCRYPTION_ALLOWLIST_FILE }}

      # Always roll ECS after a new :latest push. Otherwise Fargate can keep an old digest until
      # the task definition revision changes â€” staging API (e.g. zenith-api.apps.infoservices.com) stays stale.
      - name: Force ECS service deployment (pull new image)
        if: matrix.branch == github.ref_name
        run: |
          set -euo pipefail

          RESOLVED_SERVICE_ARN=$(aws ecs list-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "serviceArns[?contains(@, \`${SERVICE_NAME}-${STAGE}-ZenithService\`)] | [0]" \
            --output text)

          if [ -z "$RESOLVED_SERVICE_ARN" ] || [ "$RESOLVED_SERVICE_ARN" = "None" ]; then
            echo "ERROR: Could not resolve ECS service in cluster '$ECS_CLUSTER_NAME' with prefix '${SERVICE_NAME}-${STAGE}-ZenithService'."
            echo "Hint: Verify AWS_REGION/account, and that the Serverless stack has created the ECS service."
            exit 1
          fi

          RESOLVED_SERVICE_NAME="${RESOLVED_SERVICE_ARN##*/}"
          echo "Resolved ECS service: $RESOLVED_SERVICE_NAME"

          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$RESOLVED_SERVICE_NAME" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" --query 'taskDefinition' > task-def.json
          
          jq --arg tenant "$AZURE_MSAL_TENANT_ID" --arg client "$AZURE_MSAL_CLIENT_ID" \
            '.containerDefinitions[0].environment |= map(if .name == "AZURE_MSAL_TENANT_ID" then .value = $tenant elif .name == "AZURE_MSAL_CLIENT_ID" then .value = $client else . end)' \
            task-def.json > new-task-def.json
            
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' new-task-def.json > final-task-def.json
          
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://final-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          
          echo "Registered new task definition: $NEW_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$RESOLVED_SERVICE_NAME" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Install frontend dependencies
        if: matrix.branch == github.ref_name
        run: npm install --legacy-peer-deps

      # Staging only: directly add /api/* â†’ backend proxy behavior to the EXISTING
      # CloudFront distribution (identified by CLOUDFRONT_DISTRIBUTION_ID_STAGING secret).
      # Uses direct AWS CloudFront API (not CloudFormation) so the LIVE distribution
      # is updated, not a new one created. Production is untouched (cloudfront_api_proxy=false).
      - name: Add /api/* proxy to existing staging CloudFront distribution
        if: matrix.branch == github.ref_name && matrix.cloudfront_api_proxy == 'true'
        env:
          DIST_ID: ${{ secrets[matrix.cloudfront_secret] }}
        run: |
          set -euo pipefail
          cat << 'PYEOF' > patch_cf.py
          import os, json, subprocess, sys
          
          domain = "zenith-hr-staging.apps.infoservices.com"
          print(f"Looking up CloudFront distribution for {domain}...")
          
          try:
              raw_list = subprocess.check_output(['aws', 'cloudfront', 'list-distributions'])
              dists = json.loads(raw_list).get('DistributionList', {}).get('Items', [])
              
              dist_id = None
              for d in dists:
                  aliases = d.get('Aliases', {}).get('Items', [])
                  if domain in aliases:
                      dist_id = d['Id']
                      break
              
              if not dist_id:
                  print(f"ERROR: No CloudFront distribution found with alias {domain}")
                  sys.exit(1)
                  
              print(f"Found distribution {dist_id}")
              
              env_file = os.environ.get('GITHUB_ENV')
              if env_file:
                  with open(env_file, 'a') as f:
                      f.write(f"ACTUAL_DIST_ID={dist_id}\n")
              
              raw = subprocess.check_output(['aws', 'cloudfront', 'get-distribution-config', '--id', dist_id])
              result = json.loads(raw)
              etag = result['ETag']
              cfg = result['DistributionConfig']
          
              # Idempotent checks
              origin_exists = any(o['Id'] == 'ApiOrigin' for o in cfg['Origins']['Items'])
              if cfg.get('CacheBehaviors') and cfg['CacheBehaviors'].get('Items'):
                  for b in list(cfg['CacheBehaviors']['Items']):
                      if b.get('PathPattern') == '/api/*':
                          cfg['CacheBehaviors']['Items'].remove(b)
                          break
              
              behavior_exists = False
          
              # 1. Add API Origin (if missing)
              if not origin_exists:
                  cfg['Origins']['Items'].append({
                      'Id': 'ApiOrigin',
                      'DomainName': 'zenith-api.apps.infoservices.com',
                      'CustomOriginConfig': {
                          'HTTPSPort': 443,
                          'HTTPPort': 80,
                          'OriginProtocolPolicy': 'https-only',
                          'OriginSSLProtocols': {'Quantity': 1, 'Items': ['TLSv1.2']},
                          'OriginReadTimeout': 30,
                          'OriginKeepaliveTimeout': 5,
                      },
                      'ConnectionAttempts': 3,
                      'ConnectionTimeout': 10,
                  })
                  cfg['Origins']['Quantity'] = len(cfg['Origins']['Items'])
          
              # 2. Add /api/* behavior
              if not behavior_exists:
                  api_behavior = {
                      'PathPattern': '/api/*',
                      'TargetOriginId': 'ApiOrigin',
                      'ViewerProtocolPolicy': 'redirect-to-https',
                      'AllowedMethods': {
                          'Quantity': 7,
                          'Items': ['GET', 'HEAD', 'OPTIONS', 'PUT', 'POST', 'PATCH', 'DELETE'],
                          'CachedMethods': {'Quantity': 2, 'Items': ['GET', 'HEAD']},
                      },
                      'ForwardedValues': {
                          'QueryString': True,
                          'Cookies': {'Forward': 'all'},
                          'Headers': {'Quantity': 5, 'Items': ['Authorization', 'Content-Type', 'Accept', 'Origin', 'Referer']},
                          'QueryStringCacheKeys': {'Quantity': 0}
                      },
                      'MinTTL': 0,
                      'DefaultTTL': 0,
                      'MaxTTL': 0,
                      'Compress': True,
                      'SmoothStreaming': False,
                      'TrustedSigners': {'Enabled': False, 'Quantity': 0},
                      'TrustedKeyGroups': {'Enabled': False, 'Quantity': 0},
                      'LambdaFunctionAssociations': {'Quantity': 0},
                      'FunctionAssociations': {'Quantity': 0},
                      'FieldLevelEncryptionId': ''
                  }
                  if 'CacheBehaviors' not in cfg or not cfg.get('CacheBehaviors'):
                      cfg['CacheBehaviors'] = {'Quantity': 0, 'Items': []}
                  if 'Items' not in cfg['CacheBehaviors']:
                      cfg['CacheBehaviors']['Items'] = []
                  cfg['CacheBehaviors']['Items'].insert(0, api_behavior)
                  cfg['CacheBehaviors']['Quantity'] = len(cfg['CacheBehaviors']['Items'])
          
              with open('dist_config.json', 'w') as f:
                  json.dump(cfg, f)
          
              # 3. Push update
              subprocess.run(
                  ['aws', 'cloudfront', 'update-distribution',
                   '--id', dist_id,
                   '--if-match', etag,
                   '--distribution-config', 'file://dist_config.json'],
                  check=True
              )
              print(f"Distribution {dist_id} updated successfully.")
          except subprocess.CalledProcessError as e:
              print(f"AWS CLI ERROR: {e}")
              if e.output:
                  print(e.output.decode())
              if e.stderr:
                  print(e.stderr.decode())
              sys.exit(1)
          except Exception as e:
              print(f"PYTHON ERROR: {e}")
              sys.exit(1)
          PYEOF
          python3 patch_cf.py
          echo "Staging CloudFront API proxy enabled."


      - name: Build frontend
        if: matrix.branch == github.ref_name
        env:
          # Staging: use same-origin URL so /api/* goes through CloudFront proxy (no CORS).
          # Production: use the configured API base secret.
          VITE_API_BASE: ${{ matrix.vite_api_base != '' && matrix.vite_api_base || secrets[matrix.api_base_secret] }}
          # Consolidated onto the same secrets the backend uses (AZURE_MSAL_*) so frontend
          # and backend can never validate against different tenant/app registrations.
          VITE_MSAL_CLIENT_ID: ${{ secrets.AZURE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ secrets.AZURE_MSAL_TENANT_ID }}
        run: npm run build

      - name: Deploy frontend to S3
        if: matrix.branch == github.ref_name
        env:
          S3_BUCKET: ${{ secrets[matrix.s3_bucket_secret] }}
        run: |
          set -euo pipefail

          # 1) Upload hashed assets FIRST, WITHOUT --delete. Hashed filenames make orphans harmless,
          #    and keeping old assets means a stale cached index.html still resolves during rollout.
          #    (Previously --delete here could orphan the live index.html -> blank page if the
          #     index.html upload below failed, leaving it pointing at just-deleted assets.)
          aws s3 sync dist s3://$S3_BUCKET \
            --cache-control max-age=31536000,public \
            --exclude index.html

          # 2) Verify the asset(s) referenced by THIS build exist in S3 before flipping index.html.
          for ref in $(grep -oE 'assets/[^"]+\.(js|css)' dist/index.html | sort -u); do
            if ! aws s3 ls "s3://$S3_BUCKET/$ref" >/dev/null 2>&1; then
              echo "ERROR: $ref missing in S3 after sync; aborting before index.html update."
              exit 1
            fi
          done

          # 3) Only now publish the new index.html (no-cache) that points at the verified assets.
          aws s3 cp dist/index.html s3://$S3_BUCKET/index.html \
            --cache-control max-age=0,no-cache,no-store,must-revalidate \
            --content-type text/html

          # 4) Prune stale assets AFTER the new index.html is live (safe; nothing references them).
          aws s3 sync dist s3://$S3_BUCKET \
            --delete \
            --cache-control max-age=31536000,public \
            --exclude index.html

      - name: Invalidate CloudFront cache
        if: matrix.branch == github.ref_name
        env:
          DISTRIBUTION_ID: ${{ secrets[matrix.cloudfront_secret] }}
          S3_BUCKET: ${{ secrets[matrix.s3_bucket_secret] }}
        run: |
          set -euo pipefail
          TARGET_DIST_ID="${DISTRIBUTION_ID:-}"
          RESOLVED_ID=""

          # 1) Check if the secret DISTRIBUTION_ID is valid in AWS
          if [ -n "$TARGET_DIST_ID" ] && [ "$TARGET_DIST_ID" != "None" ]; then
            if aws cloudfront get-distribution --id "$TARGET_DIST_ID" >/dev/null 2>&1; then
              RESOLVED_ID="$TARGET_DIST_ID"
              echo "Using valid CloudFront distribution from secret: $RESOLVED_ID"
            else
              echo "Warning: Configured distribution ID '$TARGET_DIST_ID' does not exist in AWS CloudFront."
            fi
          fi

          # 2) If not valid, attempt to discover the distribution ID dynamically
          if [ -z "$RESOLVED_ID" ]; then
            echo "Attempting to dynamically resolve CloudFront distribution ID..."

            # Method A: Query CloudFormation stack resource
            STACK_NAME="${SERVICE_NAME}-${STAGE}"
            CFN_DIST_ID=$(aws cloudformation describe-stack-resource \
              --stack-name "$STACK_NAME" \
              --logical-resource-id ZenithCloudFrontDistribution \
              --region "$AWS_REGION" \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text 2>/dev/null || echo "")

            if [ -n "$CFN_DIST_ID" ] && [ "$CFN_DIST_ID" != "None" ]; then
              RESOLVED_ID="$CFN_DIST_ID"
              echo "Resolved CloudFront distribution from CloudFormation stack '$STACK_NAME': $RESOLVED_ID"
            fi

            # Method B: Search CloudFront distributions by origin bucket or S3_BUCKET_DOMAIN alias
            if [ -z "$RESOLVED_ID" ]; then
              LOOKUP_DOMAIN="${S3_BUCKET_DOMAIN:-$S3_BUCKET}"
              if [ -n "$LOOKUP_DOMAIN" ]; then
                MATCHED_ID=$(aws cloudfront list-distributions \
                  --query "DistributionList.Items[?contains(Aliases.Items || \`[]\`, \`$LOOKUP_DOMAIN\`) || contains(Origins.Items[0].DomainName, \`$S3_BUCKET\`)].Id | [0]" \
                  --output text 2>/dev/null || echo "")
                if [ -n "$MATCHED_ID" ] && [ "$MATCHED_ID" != "None" ]; then
                  RESOLVED_ID="$MATCHED_ID"
                  echo "Resolved CloudFront distribution matching domain/bucket '$LOOKUP_DOMAIN': $RESOLVED_ID"
                fi
              fi
            fi
          fi

          # 3) Invalidate cache if a valid distribution is found, else log a safe warning
          if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ] && [ "$RESOLVED_ID" != "null" ]; then
            echo "Creating CloudFront invalidation for distribution: $RESOLVED_ID"
            aws cloudfront create-invalidation --distribution-id "$RESOLVED_ID" --paths "/*"
            echo "CloudFront invalidation created successfully."
          else
            echo "Warning: No valid CloudFront distribution found. Skipping cache invalidation."
          fi

