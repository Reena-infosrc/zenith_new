name: Zenith HR Pulse CI/CD

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ---------- Configure AWS ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------- Backend: Docker Build & Push ----------
      - name: Log in to Amazon ECR
        env:
          ECR_ACCOUNT: ${{ secrets.ECR_ACCOUNT }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Ensure ECR repo exists
        env:
          ECR_REPO_NAME: ${{ secrets.ECR_REPO }}
          ECR_ACCOUNT: ${{ secrets.ECR_ACCOUNT }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          REPO="${ECR_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_NAME}"
          if ! aws ecr describe-repositories --repository-names "${ECR_REPO_NAME}" --region $AWS_REGION >/dev/null 2>&1; then
            echo "Creating ECR repo ${ECR_REPO_NAME}"
            aws ecr create-repository --repository-name "${ECR_REPO_NAME}" --region $AWS_REGION || true
          else
            echo "ECR repo exists"
          fi
          echo "IMAGE_URI=${REPO}" >> $GITHUB_ENV

      - name: Build & Push Backend Docker Image
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
        run: |
          IMAGE_TAG=${IMAGE_URI}:${GITHUB_SHA::7}
          echo "Building Docker image: ${IMAGE_URI}:latest and ${IMAGE_TAG}"
          
          # Use BuildKit for better caching and build performance
          # --no-cache flag ensures fresh dependencies are installed
          DOCKER_BUILDKIT=1 docker build \
            --no-cache \
            -t ${IMAGE_URI}:latest \
            -t ${IMAGE_TAG} \
            ./backend
          
          echo "Pushing images..."
          docker push ${IMAGE_URI}:latest
          docker push ${IMAGE_TAG}
          
          echo "✅ Docker image build and push completed successfully"
          echo "📦 Verifying files and dependencies in image..."
          docker run --rm ${IMAGE_URI}:latest ls -la /app/app/routers/admin_auth.py || echo "⚠️ admin_auth.py not found in image"
          docker run --rm ${IMAGE_URI}:latest python -c "from jose import jwt as jose_jwt; print('✅ python-jose installed')" || echo "⚠️ python-jose not installed"
          docker run --rm ${IMAGE_URI}:latest grep -A 5 "def exchange_msal_token" /app/app/routers/auth.py || echo "⚠️ msal-token endpoint not found"

      # ---------- Check if CloudFormation template changed ----------
      - name: Check if CloudFormation template changed
        id: template_changed
        run: |
          git fetch origin zenith-deployment-changes --depth=1 || true
          if git diff --name-only origin/zenith-deployment-changes...HEAD | grep -q '^backend/serverless.yml$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy CloudFormation Stack (only when template changed)
        if: steps.template_changed.outputs.changed == 'true'
        env:
          STAGE: dev
          JWT_SECRET: ${{ secrets.ZENITH_JWT_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          STACK_NAME="ZenithHrPulse-${STAGE}"
          TEMPLATE_FILE="./backend/serverless.yml"

          echo "Deploying CloudFormation stack: $STACK_NAME using $TEMPLATE_FILE"
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides Stage=${STAGE} JWTSecret=${JWT_SECRET} \
            --region $AWS_REGION

      # ---------- Force stop running tasks and redeploy ----------
       # ---------- Register new task definition and update ECS service ----------
      - name: Register new task definition and update ECS service
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
          SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          set -e
          IMAGE_TAG=${GITHUB_SHA::7}
          NEW_IMAGE="${IMAGE_URI}:${IMAGE_TAG}"
          echo "🔄 Updating ECS service with new image: $NEW_IMAGE"

          # Get current task definition
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region $AWS_REGION \
            --query 'services[0].taskDefinition' --output text)
          echo "📋 Current task definition: $CURRENT_TASK_DEF"

          # Get current task definition details
          aws ecs describe-task-definition --task-definition "$CURRENT_TASK_DEF" \
            --region $AWS_REGION --query 'taskDefinition' > /tmp/current-taskdef.json

          # Remove fields that shouldn't be in new task definition
          jq 'del(.status, .revision, .taskDefinitionArn, .compatibilities, .registeredAt, .registeredBy, .requiresAttributes, .placementConstraints)' \
            /tmp/current-taskdef.json > /tmp/tmpl.json

          # Update container image
          jq --arg img "$NEW_IMAGE" '.containerDefinitions[0].image = $img' \
            /tmp/tmpl.json > /tmp/new-taskdef.json

          # Register new task definition
          echo "📝 Registering new task definition..."
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-taskdef.json \
            --region $AWS_REGION \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "✅ Registered new task definition: $NEW_TASK_DEF_ARN"

          # Update service to use the new task definition
          echo "🚀 Updating ECS service to use new task definition..."
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment \
            --region $AWS_REGION

          # Wait for service to stabilize
          echo "⏳ Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region $AWS_REGION
          
          echo "✅ ECS service deployment completed successfully!"
          echo "🎉 Service is now running image: $NEW_IMAGE"

      # ---------- Frontend Build & Deploy ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json  

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        run: |
          echo "Running ESLint..."
          npm run lint --silent || echo "Lint warnings detected, continuing deployment."

      - name: Build frontend
        env:
          VITE_API_BASE: ${{ secrets.ZENITH_API_BASE }}
        run: npm run build

      - name: Sync frontend to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo "Syncing frontend to S3 bucket: $S3_BUCKET"
          aws s3 sync ./dist s3://$S3_BUCKET --delete --cache-control max-age=31536000,public --exclude index.html
          aws s3 cp ./dist/index.html s3://$S3_BUCKET/index.html --cache-control max-age=0,no-cache,no-store,must-revalidate --content-type text/html

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        if: env.CLOUDFRONT_ID != ''
        run: |
          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/index.html"