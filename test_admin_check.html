<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Check Test</title>
</head>
<body>
    <h1>Admin Status Check Test</h1>
    <div id="result"></div>
    
    <script>
        async function checkAdminStatus() {
            const email = 'jagadeesh.l@infoservices.com';
            const apiUrl = 'http://localhost:8000/api/admins/check/' + encodeURIComponent(email);
            
            console.log('Checking admin status for:', email);
            console.log('API URL:', apiUrl);
            
            try {
                const response = await fetch(apiUrl);
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Admin check result:', data);
                    
                    document.getElementById('result').innerHTML = `
                        <h2>Result for ${email}:</h2>
                        <p><strong>Is Admin:</strong> ${data.is_admin ? '✅ YES' : '❌ NO'}</p>
                        <p><strong>Response:</strong> ${JSON.stringify(data, null, 2)}</p>
                    `;
                } else {
                    console.error('Admin check failed:', response.status, response.statusText);
                    document.getElementById('result').innerHTML = `
                        <h2>Error:</h2>
                        <p>Status: ${response.status}</p>
                        <p>Status Text: ${response.statusText}</p>
                    `;
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
                document.getElementById('result').innerHTML = `
                    <h2>Error:</h2>
                    <p>${error.message}</p>
                `;
            }
        }
        
        // Run the test when page loads
        checkAdminStatus();
    </script>
</body>
</html>
