AWSTemplateFormatVersion: "2010-09-09"
Description: "Zenith HR Pulse - Dedicated CloudFront Distribution & S3 Policy Stack"

Parameters:
  Stage:
    Type: String
    Default: "staging"
    AllowedValues:
      - staging
      - prod
    Description: "Deployment stage"

  DomainBucketName:
    Type: String
    Default: "zenith-hr-staging.apps.infoservices.com"
    Description: "S3 Bucket hosting the static frontend assets"

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: "Optional ACM Certificate ARN in us-east-1 for custom domain (leave empty to use default *.cloudfront.net)"

  # When true, CloudFront proxies /api/* to ApiDomain so the browser makes
  # same-origin requests — completely eliminating CORS preflight failures.
  # Set to true for staging, false (default) for production.
  EnableApiProxy:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable /api/* reverse-proxy to ApiDomain (staging only)"

  ApiDomain:
    Type: String
    Default: "zenith-api.apps.infoservices.com"
    Description: "Backend API domain to proxy /api/* requests to (used only when EnableApiProxy=true)"

Conditions:
  HasCustomCertificate: !Not [!Equals [!Ref AcmCertificateArn, ""]]
  ApiProxyEnabled: !Equals [!Ref EnableApiProxy, "true"]

Resources:
  # 1. Origin Access Identity for CloudFront to read private S3 objects
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "OAI for Zenith frontend ${Stage}"

  # 2. S3 Bucket Policy allowing CloudFront OAI read access
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DomainBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontGetObject
            Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${DomainBucketName}/*"

  # 3. CloudFront Distribution configured for React SPA
  FrontendCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub "Zenith HR Pulse Frontend (${Stage})"
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${DomainBucketName}.s3.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
          # API proxy origin — only used when EnableApiProxy=true (staging)
          - !If
            - ApiProxyEnabled
            - Id: ApiOrigin
              DomainName: !Ref ApiDomain
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols:
                  - TLSv1.2
            - !Ref AWS::NoValue

        # /api/* → backend API (staging only, no CORS because same CloudFront domain)
        CacheBehaviors: !If
          - ApiProxyEnabled
          - - PathPattern: "/api/*"
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - POST
                - PATCH
                - DELETE
              CachedMethods:
                - GET
                - HEAD
              ForwardedValues:
                QueryString: true
                Headers:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Origin
                  - X-Requested-With
                Cookies:
                  Forward: none
              # Never cache API responses
              MinTTL: 0
              DefaultTTL: 0
              MaxTTL: 0
          - !Ref AWS::NoValue

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
        Aliases: !If
          - HasCustomCertificate
          - [!Ref DomainBucketName]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomCertificate
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

Outputs:
  DistributionId:
    Description: "CloudFront Distribution ID (save as CLOUDFRONT_DISTRIBUTION_ID_STAGING in GitHub Secrets)"
    Value: !Ref FrontendCloudFrontDistribution
    Export:
      Name: !Sub "zenith-hr-${Stage}-CloudFrontDistributionId"

  DistributionDomainName:
    Description: "CloudFront Domain Name"
    Value: !GetAtt FrontendCloudFrontDistribution.DomainName
