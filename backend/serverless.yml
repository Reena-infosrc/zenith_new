service: ${env:SERVICE_NAME, 'zenith-hr-platform'}

# Touch this file to trigger CI serverless deploy (see .github/workflows/deploy.yml).

useDotenv: true

custom:
  ecrImageUri: ${env:ECR_IMAGE_URI, "${env:AWS_ACCOUNT_ID}.dkr.ecr.${self:provider.region}.amazonaws.com/${env:ECR_REPOSITORY}:latest"}
  acmCertificateArn: ${env:ACM_CERTIFICATE_ARN}
  awsAccountId: ${env:AWS_ACCOUNT_ID}
  # KMS: explicit ARN from env, else stack alias created by ZenithFieldEncryptionKeyAlias
  fieldEncryptionKmsKeyArn: ${env:DYNAMODB_FIELD_ENCRYPTION_KMS_KEY_ARN, 'arn:aws:kms:${self:provider.region}:${self:custom.awsAccountId}:alias/zenith-hr-field-encryption-${self:provider.stage}'}
  fieldEncryptionKmsKeyArnV2: ${env:DYNAMODB_FIELD_ENCRYPTION_KMS_KEY_ARN_V2, ''}

  s3PhotosBucket: ${env:S3_BUCKET_PHOTOS}
  s3DocumentsBucket: ${env:S3_BUCKET_DOCUMENTS}
  s3DomainBucket: ${env:S3_BUCKET_DOMAIN}

  dynamoDbTables:
    employees: ${env:DYNAMODB_TABLE_EMPLOYEES}
    users: ${env:DYNAMODB_TABLE_USERS}
    admin: ${env:DYNAMODB_TABLE_ADMIN}
    review: ${env:DYNAMODB_TABLE_REVIEW}
    reviewDraft: ${env:DYNAMODB_TABLE_REVIEW_DRAFT}
    clientSatisfaction: ${env:DYNAMODB_TABLE_CLIENT_SATISFACTION}
    clients: ${env:DYNAMODB_TABLE_CLIENTS}
    competencies: ${env:DYNAMODB_TABLE_COMPETENCIES}
    cycle: ${env:DYNAMODB_TABLE_CYCLE}
    engagementActivities: ${env:DYNAMODB_TABLE_ENGAGEMENT_ACTIVITIES}
    resourceMappings: ${env:DYNAMODB_TABLE_RESOURCE_MAPPINGS}
    revenueForecasts: ${env:DYNAMODB_TABLE_REVENUE_FORECASTS}
    clientRmFeedback: ${env:DYNAMODB_TABLE_CLIENT_RM_FEEDBACK}
    leadershipAccess: ${env:DYNAMODB_TABLE_LEADERSHIP_ACCESS}
    monthlyFeedbackPeriods: ${env:DYNAMODB_TABLE_MONTHLY_FEEDBACK_PERIODS}

  # VPC Configuration
  vpcId: !Ref ZenithHrPulseVPC
  publicSubnet1: !Ref PublicSubnet1
  publicSubnet2: !Ref PublicSubnet2
  zenithSecurityGroup: !Ref ZenithSecurityGroup

plugins:
  - serverless-dotenv-plugin

provider:
  name: aws
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'prod'}
  stackTags:
    Name: infosrv-zenith
    AppOwner: ${env:APP_OWNER}
    InfraOwner: ${env:INFRA_OWNER}
    Environment: ${self:provider.stage}
  httpApi:
    metrics: true
  environment:
    STAGE: ${self:provider.stage}
    ENVIRONMENT: ${env:ENVIRONMENT, 'production'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:CreateLogGroup
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.employees}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.employees}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.admin}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.admin}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.review}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.review}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.reviewDraft}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.reviewDraft}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clientSatisfaction}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clientSatisfaction}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clients}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clients}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.competencies}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.competencies}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.cycle}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.cycle}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.engagementActivities}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.engagementActivities}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.resourceMappings}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.resourceMappings}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.revenueForecasts}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.revenueForecasts}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clientRmFeedback}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clientRmFeedback}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.leadershipAccess}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.leadershipAccess}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.monthlyFeedbackPeriods}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.monthlyFeedbackPeriods}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.users}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.users}/index/*

        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:custom.s3PhotosBucket}
            - arn:aws:s3:::${self:custom.s3PhotosBucket}/*
            - arn:aws:s3:::${self:custom.s3DocumentsBucket}
            - arn:aws:s3:::${self:custom.s3DocumentsBucket}/*
            - arn:aws:s3:::${self:custom.s3DomainBucket}
            - arn:aws:s3:::${self:custom.s3DomainBucket}/*

        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: arn:aws:bedrock:${self:provider.region}::foundation-model/*

resources:
  Conditions:
    HasFieldEncryptionKmsKeyArnV2:
      Fn::Not:
        - Fn::Equals:
            - ${env:DYNAMODB_FIELD_ENCRYPTION_KMS_KEY_ARN_V2, ''}
            - ''

  Resources:
    ZenithHrPulseVPC:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.0.0.0/26
        EnableDnsSupport: true
        EnableDnsHostnames: true

    PublicSubnet1:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        CidrBlock: 10.0.0.0/27
        AvailabilityZone: !Select
          - 0
          - !GetAZs ""
        MapPublicIpOnLaunch: true

    PublicSubnet2:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        CidrBlock: 10.0.0.32/27
        AvailabilityZone: !Select
          - 1
          - !GetAZs ""
        MapPublicIpOnLaunch: true

    InternetGateway:
      Type: AWS::EC2::InternetGateway

    AttachGateway:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        InternetGatewayId: !Ref InternetGateway

    PublicRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref ZenithHrPulseVPC

    PublicRoute:
      Type: AWS::EC2::Route
      DependsOn: AttachGateway
      Properties:
        RouteTableId: !Ref PublicRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        GatewayId: !Ref InternetGateway

    PublicSubnet1RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PublicSubnet1
        RouteTableId: !Ref PublicRouteTable

    PublicSubnet2RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PublicSubnet2
        RouteTableId: !Ref PublicRouteTable

    # VPC endpoints so Fargate can pull images when public ECR is unreachable.
    VpcEndpointSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: HTTPS ingress for VPC interface endpoints
        VpcId: !Ref ZenithHrPulseVPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 10.0.0.0/26

    EcrApiVpcEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
        VpcEndpointType: Interface
        PrivateDnsEnabled: true
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        SecurityGroupIds:
          - !Ref VpcEndpointSecurityGroup

    EcrDkrVpcEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
        VpcEndpointType: Interface
        PrivateDnsEnabled: true
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        SecurityGroupIds:
          - !Ref VpcEndpointSecurityGroup

    S3VpcEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
        VpcEndpointType: Gateway
        RouteTableIds:
          - !Ref PublicRouteTable

    StsVpcEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
        VpcEndpointType: Interface
        PrivateDnsEnabled: true
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        SecurityGroupIds:
          - !Ref VpcEndpointSecurityGroup

    ZenithSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Allow ALB and ECS traffic
        VpcId: ${self:custom.vpcId}
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: 0.0.0.0/0
          - IpProtocol: tcp
            FromPort: 5000
            ToPort: 5000
            CidrIp: 10.0.0.0/26
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0

    ZenithCluster:
      Type: AWS::ECS::Cluster
      Properties:
        ClusterName: zenith-hr-pulse-${self:provider.stage}

    # ECS agent: pull image + write logs only (AWS best practice).
    TaskExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

    # Application credentials (boto3 in the API container). KMS is scoped to the field-encryption CMK only.
    ZenithAppTaskRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole

    ZenithFieldEncryptionKey:
      Type: AWS::KMS::Key
      Properties:
        Description: Field-level encryption for Zenith HR sensitive data
        EnableKeyRotation: true
        KeyPolicy:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowRootAccount
              Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: "kms:*"
              Resource: "*"
            - Sid: AllowAppTaskRole
              Effect: Allow
              Principal:
                AWS: !GetAtt ZenithAppTaskRole.Arn
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey
                - kms:DescribeKey
              Resource: "*"

    ZenithFieldEncryptionKeyAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/zenith-hr-field-encryption-${self:provider.stage}
        TargetKeyId: !Ref ZenithFieldEncryptionKey

    # Attached after the CMK exists so KMS ARNs resolve. IAM + key policy must both allow the app role.
    ZenithAppTaskPolicy:
      Type: AWS::IAM::Policy
      DependsOn: ZenithFieldEncryptionKey
      Properties:
        PolicyName: ZenithApiAppPermissions
        Roles:
          - !Ref ZenithAppTaskRole
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:*
                - s3:*
                - bedrock:*
              Resource: "*"
            - Sid: FieldEncryptionKmsOnStackCmk
              Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey
                - kms:DescribeKey
              Resource:
                - !GetAtt ZenithFieldEncryptionKey.Arn
            - Sid: FieldEncryptionKmsFromDeployEnv
              Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey
                - kms:DescribeKey
              Resource:
                - ${self:custom.fieldEncryptionKmsKeyArn}
            - Fn::If:
              - HasFieldEncryptionKmsKeyArnV2
              - Sid: FieldEncryptionKmsV2FromDeployEnv
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - ${self:custom.fieldEncryptionKmsKeyArnV2}
              - !Ref AWS::NoValue

    # One-time deploy hook: add ZenithAppTaskRole to the configured CMK key policy (idempotent).
    GrantFieldEncryptionKmsPolicyLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: GrantFieldEncryptionKmsKeyPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - kms:GetKeyPolicy
                    - kms:PutKeyPolicy
                    - kms:DescribeKey
                  Resource: "*"

    GrantFieldEncryptionKmsPolicyFunction:
      Type: AWS::Lambda::Function
      DependsOn: ZenithAppTaskRole
      Properties:
        FunctionName: zenith-grant-field-enc-kms-${self:provider.stage}
        Runtime: python3.12
        Handler: index.handler
        Role: !GetAtt GrantFieldEncryptionKmsPolicyLambdaRole.Arn
        Timeout: 120
        Code:
          ZipFile: |
            import json
            import traceback
            import urllib3
            import boto3

            SID = "AllowZenithAppTaskRoleFieldEncryption"
            http = urllib3.PoolManager()

            def cfn_send(event, context, status, data=None, physical_resource_id=None, reason=None):
                body = json.dumps({
                    "Status": status,
                    "Reason": reason or ("See log stream: " + context.log_stream_name),
                    "PhysicalResourceId": physical_resource_id or event.get("PhysicalResourceId") or context.log_stream_name,
                    "StackId": event["StackId"],
                    "RequestId": event["RequestId"],
                    "LogicalResourceId": event["LogicalResourceId"],
                    "Data": data or {},
                })
                http.request(
                    "PUT",
                    event["ResponseURL"],
                    headers={"content-type": "", "content-length": str(len(body))},
                    body=body,
                )

            def resolve_key_id(kms, key_arn):
                if ":alias/" in key_arn:
                    return kms.describe_key(KeyId=key_arn)["KeyMetadata"]["KeyId"]
                return key_arn.split("/")[-1]

            def grant_key_policy(kms, key_arn, task_role_arn):
                key_id = resolve_key_id(kms, key_arn)
                policy = json.loads(kms.get_key_policy(KeyId=key_id, PolicyName="default")["Policy"])
                for statement in policy.get("Statement", []):
                    if statement.get("Sid") == SID:
                        return "already_present"
                policy.setdefault("Statement", []).append({
                    "Sid": SID,
                    "Effect": "Allow",
                    "Principal": {"AWS": task_role_arn},
                    "Action": [
                        "kms:Encrypt",
                        "kms:Decrypt",
                        "kms:GenerateDataKey",
                        "kms:DescribeKey",
                    ],
                    "Resource": "*",
                })
                kms.put_key_policy(KeyId=key_id, PolicyName="default", Policy=json.dumps(policy))
                return "granted"

            def handler(event, context):
                props = event["ResourceProperties"]
                key_arn = props["KeyArn"]
                task_role_arn = props["TaskRoleArn"]
                try:
                    if event["RequestType"] == "Delete":
                        cfn_send(event, context, "SUCCESS", physical_resource_id=key_arn)
                        return
                    kms = boto3.client("kms")
                    result = grant_key_policy(kms, key_arn, task_role_arn)
                    cfn_send(event, context, "SUCCESS", {"Result": result}, physical_resource_id=key_arn)
                except Exception as exc:
                    traceback.print_exc()
                    cfn_send(event, context, "FAILED", reason=str(exc))

    GrantFieldEncryptionKmsKeyPolicy:
      Type: AWS::CloudFormation::CustomResource
      DependsOn:
        - GrantFieldEncryptionKmsPolicyFunction
        - ZenithAppTaskPolicy
      Properties:
        ServiceToken: !GetAtt GrantFieldEncryptionKmsPolicyFunction.Arn
        KeyArn: ${self:custom.fieldEncryptionKmsKeyArn}
        TaskRoleArn: !GetAtt ZenithAppTaskRole.Arn

    GrantFieldEncryptionKmsPolicyInvoke:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref GrantFieldEncryptionKmsPolicyFunction
        Action: lambda:InvokeFunction
        Principal: cloudformation.amazonaws.com

    ECSLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /ecs/zenith-hr-pulse-${self:provider.stage}
        RetentionInDays: 7

    ZenithALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Properties:
        Type: application
        Subnets:
          - ${self:custom.publicSubnet1}
          - ${self:custom.publicSubnet2}
        SecurityGroups:
          - ${self:custom.zenithSecurityGroup}
        # Default ALB idle timeout is 60s; gunicorn uses --timeout 120 in Dockerfile — align to avoid 504s.
        LoadBalancerAttributes:
          - Key: idle_timeout.timeout_seconds
            Value: "120"

    ZenithTargetGroup:
      Type: AWS::ElasticLoadBalancingV2::TargetGroup
      Properties:
        VpcId: ${self:custom.vpcId}
        Port: 5000
        Protocol: HTTP
        TargetType: ip
        HealthCheckEnabled: true
        HealthCheckPath: /health
        HealthCheckIntervalSeconds: 30
        HealthCheckTimeoutSeconds: 10
        HealthyThresholdCount: 2
        UnhealthyThresholdCount: 5
        Matcher:
          HttpCode: 200-399

    ZenithListener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !Ref ZenithALB
        Port: 80
        Protocol: HTTP
        DefaultActions:
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301

    ZenithHttpsListener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !Ref ZenithALB
        Port: 443
        Protocol: HTTPS
        Certificates:
          - CertificateArn: ${self:custom.acmCertificateArn}
        DefaultActions:
          - Type: forward
            TargetGroupArn: !Ref ZenithTargetGroup

    ZenithTaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: zenith-hr-pulse-${self:provider.stage}
        Cpu: "1024"
        Memory: "2048"
        NetworkMode: awsvpc
        RequiresCompatibilities:
          - FARGATE
        ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
        TaskRoleArn: !GetAtt ZenithAppTaskRole.Arn
        ContainerDefinitions:
          - Name: api
            Image: ${self:custom.ecrImageUri}
            PortMappings:
              - ContainerPort: 5000
            Environment:
              - Name: AWS_REGION
                Value: ${self:provider.region}
              - Name: STAGE
                Value: ${self:provider.stage}
              - Name: ENVIRONMENT
                Value: ${env:ENVIRONMENT, 'production'}
              - Name: AZURE_MSAL_CLIENT_ID
                Value: ${env:AZURE_MSAL_CLIENT_ID, ''}
              - Name: AZURE_MSAL_TENANT_ID
                Value: ${env:AZURE_MSAL_TENANT_ID, ''}
              - Name: DYNAMODB_TABLE_EMPLOYEES
                Value: zenith-hr-employees-${self:provider.stage}
              - Name: DYNAMODB_TABLE_USERS
                Value: zenith-hr-users-${self:provider.stage}
              - Name: DYNAMODB_TABLE_ADMIN
                Value: zenith-hr-admin-${self:provider.stage}
              - Name: DYNAMODB_TABLE_REVIEW
                Value: zenith-hr-review-${self:provider.stage}
              - Name: DYNAMODB_TABLE_REVIEW_DRAFT
                Value: zenith-hr-review-draft-${self:provider.stage}
              - Name: DYNAMODB_TABLE_CLIENT_SATISFACTION
                Value: zenith-hr-client-satisfaction-${self:provider.stage}
              - Name: DYNAMODB_TABLE_CLIENTS
                Value: zenith-hr-clients-${self:provider.stage}
              - Name: DYNAMODB_TABLE_COMPETENCIES
                Value: zenith-hr-competencies-${self:provider.stage}
              - Name: DYNAMODB_TABLE_CYCLE
                Value: zenith-hr-cycle-${self:provider.stage}
              - Name: DYNAMODB_TABLE_ENGAGEMENT_ACTIVITIES
                Value: zenith-hr-engagement-activities-${self:provider.stage}
              - Name: DYNAMODB_TABLE_RESOURCE_MAPPINGS
                Value: zenith-hr-resource-mappings-${self:provider.stage}
              - Name: DYNAMODB_TABLE_REVENUE_FORECASTS
                Value: zenith-hr-revenue-forecasts-${self:provider.stage}
              - Name: DYNAMODB_TABLE_GOALS
                Value: zenith-hr-goals-${self:provider.stage}
              - Name: DYNAMODB_TABLE_FEEDBACK
                Value: zenith-hr-feedback-${self:provider.stage}
              - Name: DYNAMODB_TABLE_RECRUITMENT
                Value: zenith-hr-recruitment-${self:provider.stage}
              - Name: DYNAMODB_TABLE_FEATURES
                Value: zenith-hr-feature-flags-${self:provider.stage}
              - Name: DYNAMODB_TABLE_CLIENT_RM_FEEDBACK
                Value: zenith-hr-client-rm-feedback-${self:provider.stage}
              - Name: DYNAMODB_TABLE_LEADERSHIP_ACCESS
                Value: zenith-hr-leadership-access-${self:provider.stage}
              - Name: DYNAMODB_TABLE_MONTHLY_FEEDBACK_PERIODS
                Value: zenith-hr-monthly-feedback-periods-${self:provider.stage}
              - Name: S3_BUCKET_PHOTOS
