service: ${env:SERVICE_NAME, 'zenith-hr-platform'}

useDotenv: true

custom:
  ecrImageUri: ${env:ECR_IMAGE_URI, "${env:AWS_ACCOUNT_ID}.dkr.ecr.${self:provider.region}.amazonaws.com/${env:ECR_REPOSITORY}:latest"}
  acmCertificateArn: ${env:ACM_CERTIFICATE_ARN}
  awsAccountId: ${env:AWS_ACCOUNT_ID}

  s3PhotosBucket: ${env:S3_BUCKET_PHOTOS}
  s3DocumentsBucket: ${env:S3_BUCKET_DOCUMENTS}
  s3DomainBucket: ${env:S3_BUCKET_DOMAIN}

  dynamoDbTables:
    employees: ${env:DYNAMODB_TABLE_EMPLOYEES}
    users: ${env:DYNAMODB_TABLE_USERS}
    admin: ${env:DYNAMODB_TABLE_ADMIN}
    review: ${env:DYNAMODB_TABLE_REVIEW}
    reviewDraft: ${env:DYNAMODB_TABLE_REVIEW_DRAFT}
    clientSatisfaction: ${env:DYNAMODB_TABLE_CLIENT_SATISFACTION}
    clients: ${env:DYNAMODB_TABLE_CLIENTS}
    competencies: ${env:DYNAMODB_TABLE_COMPETENCIES}
    cycle: ${env:DYNAMODB_TABLE_CYCLE}
    engagementActivities: ${env:DYNAMODB_TABLE_ENGAGEMENT_ACTIVITIES}
    resourceMappings: ${env:DYNAMODB_TABLE_RESOURCE_MAPPINGS}
    revenueForecasts: ${env:DYNAMODB_TABLE_REVENUE_FORECASTS}

  # VPC Configuration
  vpcId: !Ref ZenithHrPulseVPC
  publicSubnet1: !Ref PublicSubnet1
  publicSubnet2: !Ref PublicSubnet2
  zenithSecurityGroup: !Ref ZenithSecurityGroup

plugins:
  - serverless-dotenv-plugin

provider:
  name: aws
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'prod'}
  httpApi:
    metrics: true
  environment:
    STAGE: ${self:provider.stage}
    ENVIRONMENT: ${env:ENVIRONMENT, 'production'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:BatchWriteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.employees}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.employees}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.admin}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.admin}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.review}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.review}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.reviewDraft}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.reviewDraft}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clientSatisfaction}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clientSatisfaction}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clients}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.clients}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.competencies}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.competencies}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.cycle}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.cycle}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.engagementActivities}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.engagementActivities}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.resourceMappings}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.resourceMappings}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.revenueForecasts}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.revenueForecasts}/index/*
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.users}
            - arn:aws:dynamodb:${self:provider.region}:${self:custom.awsAccountId}:table/${self:custom.dynamoDbTables.users}/index/*

        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:custom.s3PhotosBucket}
            - arn:aws:s3:::${self:custom.s3PhotosBucket}/*
            - arn:aws:s3:::${self:custom.s3DocumentsBucket}
            - arn:aws:s3:::${self:custom.s3DocumentsBucket}/*
            - arn:aws:s3:::${self:custom.s3DomainBucket}
            - arn:aws:s3:::${self:custom.s3DomainBucket}/*

        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: arn:aws:bedrock:${self:provider.region}::foundation-model/*

resources:
  Resources:
    ZenithHrPulseVPC:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.0.0.0/26
        EnableDnsSupport: true
        EnableDnsHostnames: true

    PublicSubnet1:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        CidrBlock: 10.0.0.0/27
        AvailabilityZone: !Select
          - 0
          - !GetAZs ""
        MapPublicIpOnLaunch: true

    PublicSubnet2:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        CidrBlock: 10.0.0.32/27
        AvailabilityZone: !Select
          - 1
          - !GetAZs ""
        MapPublicIpOnLaunch: true

    InternetGateway:
      Type: AWS::EC2::InternetGateway

    AttachGateway:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        VpcId: !Ref ZenithHrPulseVPC
        InternetGatewayId: !Ref InternetGateway

    PublicRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref ZenithHrPulseVPC

    PublicRoute:
      Type: AWS::EC2::Route
      DependsOn: AttachGateway
      Properties:
        RouteTableId: !Ref PublicRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        GatewayId: !Ref InternetGateway

    PublicSubnet1RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PublicSubnet1
        RouteTableId: !Ref PublicRouteTable

    PublicSubnet2RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PublicSubnet2
        RouteTableId: !Ref PublicRouteTable

    ZenithSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Allow ALB and ECS traffic
        VpcId: ${self:custom.vpcId}
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: 0.0.0.0/0
          - IpProtocol: tcp
            FromPort: 5000
            ToPort: 5000
            CidrIp: 10.0.0.0/26
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0

    ZenithCluster:
      Type: AWS::ECS::Cluster
      Properties:
        ClusterName: zenith-hr-pulse-${self:provider.stage}

    TaskExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        Policies:
          - PolicyName: ECSAppPermissions
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:*
                    - s3:*
                    - bedrock:*
                  Resource: "*"

    ECSLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /ecs/zenith-hr-pulse-${self:provider.stage}
        RetentionInDays: 7

    ZenithALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Properties:
        Type: application
        Subnets:
          - ${self:custom.publicSubnet1}
          - ${self:custom.publicSubnet2}
        SecurityGroups:
          - ${self:custom.zenithSecurityGroup}

    ZenithTargetGroup:
      Type: AWS::ElasticLoadBalancingV2::TargetGroup
      Properties:
        VpcId: ${self:custom.vpcId}
        Port: 5000
        Protocol: HTTP
        TargetType: ip
        HealthCheckEnabled: true
        HealthCheckPath: /health
        HealthCheckIntervalSeconds: 30
        HealthCheckTimeoutSeconds: 10
        HealthyThresholdCount: 2
        UnhealthyThresholdCount: 5
        Matcher:
          HttpCode: 200-399

    ZenithListener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !Ref ZenithALB
        Port: 80
        Protocol: HTTP
        DefaultActions:
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301

    ZenithHttpsListener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !Ref ZenithALB
        Port: 443
        Protocol: HTTPS
        Certificates:
          - CertificateArn: ${self:custom.acmCertificateArn}
        DefaultActions:
          - Type: forward
            TargetGroupArn: !Ref ZenithTargetGroup

    ZenithTaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: zenith-hr-pulse-${self:provider.stage}
        Cpu: "512"
        Memory: "1024"
        NetworkMode: awsvpc
        RequiresCompatibilities:
          - FARGATE
        ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
        TaskRoleArn: !GetAtt TaskExecutionRole.Arn
        ContainerDefinitions:
          - Name: api
            Image: ${self:custom.ecrImageUri}
            PortMappings:
              - ContainerPort: 5000
            Environment:
              - Name: AWS_REGION
                Value: ${self:provider.region}
              - Name: STAGE
                Value: ${self:provider.stage}
              - Name: ENVIRONMENT
                Value: ${env:ENVIRONMENT, 'production'}
              - Name: AZURE_MSAL_CLIENT_ID
                Value: ${env:AZURE_MSAL_CLIENT_ID, ''}
              - Name: AZURE_MSAL_TENANT_ID
                Value: ${env:AZURE_MSAL_TENANT_ID, ''}
              - Name: DYNAMODB_TABLE_EMPLOYEES
                Value: zenith-hr-employees-${self:provider.stage}
              - Name: DYNAMODB_TABLE_USERS
                Value: zenith-hr-users-${self:provider.stage}
              - Name: DYNAMODB_TABLE_ADMIN
                Value: zenith-hr-admin-${self:provider.stage}
              - Name: DYNAMODB_TABLE_REVIEW
                Value: zenith-hr-review-${self:provider.stage}
              - Name: DYNAMODB_TABLE_REVIEW_DRAFT
                Value: zenith-hr-review-draft-${self:provider.stage}
              - Name: DYNAMODB_TABLE_CLIENT_SATISFACTION
                Value: zenith-hr-client-satisfaction-${self:provider.stage}
              - Name: DYNAMODB_TABLE_CLIENTS
                Value: zenith-hr-clients-${self:provider.stage}
              - Name: DYNAMODB_TABLE_COMPETENCIES
                Value: zenith-hr-competencies-${self:provider.stage}
              - Name: DYNAMODB_TABLE_CYCLE
                Value: zenith-hr-cycle-${self:provider.stage}
              - Name: DYNAMODB_TABLE_ENGAGEMENT_ACTIVITIES
                Value: zenith-hr-engagement-activities-${self:provider.stage}
              - Name: DYNAMODB_TABLE_RESOURCE_MAPPINGS
                Value: zenith-hr-resource-mappings-${self:provider.stage}
              - Name: DYNAMODB_TABLE_REVENUE_FORECASTS
                Value: zenith-hr-revenue-forecasts-${self:provider.stage}
              - Name: DYNAMODB_TABLE_GOALS
                Value: zenith-hr-goals-${self:provider.stage}
              - Name: DYNAMODB_TABLE_FEEDBACK
                Value: zenith-hr-feedback-${self:provider.stage}
              - Name: DYNAMODB_TABLE_RECRUITMENT
                Value: zenith-hr-recruitment-${self:provider.stage}
              - Name: DYNAMODB_TABLE_FEATURES
                Value: zenith-hr-feature-flags-${self:provider.stage}
              - Name: S3_BUCKET_PHOTOS
                Value: zenith-hr-pulse-photos-${self:provider.stage}
              - Name: S3_BUCKET_DOCUMENTS
                Value: zenith-hr-documents-${self:provider.stage}
              - Name: S3_REGION
                Value: us-east-1
              - Name: S3_PHOTOS_PREFIX
                Value: profile-photos/
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: /ecs/zenith-hr-pulse-${self:provider.stage}
                awslogs-region: us-east-1
                awslogs-stream-prefix: api

    ZenithHrAdmin:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-admin-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: created_at
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: employee_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CreatedAtIndex
            KeySchema:
              - AttributeName: created_at
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EmployeeIdIndex
            KeySchema:
              - AttributeName: employee_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrEmployees:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-employees-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: department
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: employee_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: DepartmentIndex
            KeySchema:
              - AttributeName: department
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EmployeeIdIndex
            KeySchema:
              - AttributeName: employee_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: Id-Index
            KeySchema:
              - AttributeName: id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrReview:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-review-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: employeeId
            AttributeType: S
          - AttributeName: entityType
            AttributeType: S
          - AttributeName: reviewerId
            AttributeType: S
          - AttributeName: reviewId
            AttributeType: S
          - AttributeName: reviewType
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: EmployeeIndex
            KeySchema:
              - AttributeName: employeeId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EntityTypeIndex
            KeySchema:
              - AttributeName: entityType
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ReviewerIndex
            KeySchema:
              - AttributeName: reviewerId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ReviewIdIndex
            KeySchema:
              - AttributeName: reviewId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ReviewTypeIndex
            KeySchema:
              - AttributeName: reviewType
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrClientSatisfaction:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-client-satisfaction-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: Client_Id
            AttributeType: S
          - AttributeName: created_by
            AttributeType: S
          - AttributeName: survey_date
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ClientIndex
            KeySchema:
              - AttributeName: Client_Id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: CreatedByIndex
            KeySchema:
              - AttributeName: created_by
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: SurveyDateIndex
            KeySchema:
              - AttributeName: survey_date
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrClients:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-clients-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: account_manager_id
            AttributeType: S
          - AttributeName: industry
            AttributeType: S
          - AttributeName: current_stage
            AttributeType: S

        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: AccountManagerIndex
            KeySchema:
              - AttributeName: account_manager_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: IndustryIndex
            KeySchema:
              - AttributeName: industry
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: CurrentStageIndex
            KeySchema:
              - AttributeName: current_stage
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrCompetencies:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-competencies-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: is_active
            AttributeType: S
          - AttributeName: category
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ActiveIndex
            KeySchema:
              - AttributeName: is_active
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: CategoryIndex
            KeySchema:
              - AttributeName: category
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrCycle:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-cycle-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: year
            AttributeType: S
        KeySchema:
          - AttributeName: year
            KeyType: HASH

    ZenithHrEngagementActivities:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-engagement-activities-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: category
            AttributeType: S
          - AttributeName: is_active
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CategoryIndex
            KeySchema:
              - AttributeName: category
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ActiveIndex
            KeySchema:
              - AttributeName: is_active
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrResourceMappings:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-resource-mappings-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: resource_type
            AttributeType: S
          - AttributeName: entity_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ResourceTypeIndex
            KeySchema:
              - AttributeName: resource_type
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: EntityIdIndex
            KeySchema:
              - AttributeName: entity_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrRevenueForecasts:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-revenue-forecasts-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: account
            AttributeType: S
          - AttributeName: year
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: AccountIndex
            KeySchema:
              - AttributeName: account
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: YearIndex
            KeySchema:
              - AttributeName: year
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrReviewDraft:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-review-draft-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: employeeId
            AttributeType: S
          - AttributeName: reviewerId
            AttributeType: S
          - AttributeName: reviewId
            AttributeType: S
          - AttributeName: reviewType
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: EmployeeIndex
            KeySchema:
              - AttributeName: employeeId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ReviewerIndex
            KeySchema:
              - AttributeName: reviewerId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ReviewIdIndex
            KeySchema:
              - AttributeName: reviewId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ReviewTypeIndex
            KeySchema:
              - AttributeName: reviewType
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrUsers:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-users-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
          - AttributeName: email
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrFeatureFlags:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-feature-flags-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: name
            AttributeType: S
          - AttributeName: is_active
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: NameIndex
            KeySchema:
              - AttributeName: name
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ActiveIndex
            KeySchema:
              - AttributeName: is_active
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrFeedback:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-feedback-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: fromEmployeeId
            AttributeType: S
          - AttributeName: toEmployeeId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: FromEmployeeIndex
            KeySchema:
              - AttributeName: fromEmployeeId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: ToEmployeeIndex
            KeySchema:
              - AttributeName: toEmployeeId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrRecruitment:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-recruitment-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: status
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrGoals:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: zenith-hr-goals-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: employeeId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmployeeIndex
            KeySchema:
              - AttributeName: employeeId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ZenithHrPulsePhotosBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3PhotosBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ZenithHrAppsDomainBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3DomainBucket}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: error.html

    CloudFrontOAI:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: Access identity for Zenith frontend CloudFront

    ZenithAppsDomainBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ZenithHrAppsDomainBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontGetObject
              Effect: Allow
              Principal:
                CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::${self:custom.s3DomainBucket}/*

    ZenithCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          Origins:
            - Id: ZenithAppsDomainOrigin
              DomainName: !GetAtt ZenithHrAppsDomainBucket.DomainName
              S3OriginConfig:
                OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
          DefaultCacheBehavior:
            TargetOriginId: ZenithAppsDomainOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 0
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.acmCertificateArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Aliases:
            - ${self:custom.s3DomainBucket}
          CustomErrorResponses:
            - ErrorCode: 403
              ResponsePagePath: /index.html
              ResponseCode: 200

    ZenithService:
      Type: AWS::ECS::Service
      DependsOn:
        - ZenithListener
        - ZenithHttpsListener
      Properties:
        HealthCheckGracePeriodSeconds: 180
        Cluster: !Ref ZenithCluster
        LaunchType: FARGATE
        DesiredCount: 1
        TaskDefinition: !Ref ZenithTaskDefinition
        NetworkConfiguration:
          AwsvpcConfiguration:
            AssignPublicIp: ENABLED
            Subnets:
              - ${self:custom.publicSubnet1}
              - ${self:custom.publicSubnet2}
            SecurityGroups:
              - ${self:custom.zenithSecurityGroup}
        LoadBalancers:
          - ContainerName: api
            ContainerPort: 5000
            TargetGroupArn: !Ref ZenithTargetGroup

  Outputs:
    ALBEndpoint:
      Value: !GetAtt ZenithALB.DNSName
      Description: "URL of the Application Load Balancer"
