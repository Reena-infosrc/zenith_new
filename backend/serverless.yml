    ZenithHrPulsePhotosBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3PhotosBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ZenithHrAppsDomainBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3DomainBucket}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: error.html

    CloudFrontOAI:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: Access identity for Zenith frontend CloudFront

    ZenithAppsDomainBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ZenithHrAppsDomainBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontGetObject
              Effect: Allow
              Principal:
                CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::${self:custom.s3DomainBucket}/*

    ZenithCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          Origins:
            - Id: ZenithAppsDomainOrigin
              DomainName: !GetAtt ZenithHrAppsDomainBucket.DomainName
              S3OriginConfig:
                OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
          DefaultCacheBehavior:
            TargetOriginId: ZenithAppsDomainOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 0
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.acmCertificateArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Aliases:
            - ${self:custom.s3DomainBucket}
          CustomErrorResponses:
            - ErrorCode: 403
              ResponsePagePath: /index.html
              ResponseCode: 200

    ZenithService:
      Type: AWS::ECS::Service
      DependsOn:
        - ZenithListener
        - ZenithHttpsListener
      Properties:
        HealthCheckGracePeriodSeconds: 180
        Cluster: !Ref ZenithCluster
        LaunchType: FARGATE
        DesiredCount: 1
        TaskDefinition: !Ref ZenithTaskDefinition
        NetworkConfiguration:
          AwsvpcConfiguration:
            AssignPublicIp: ENABLED
            Subnets:
              - ${self:custom.publicSubnet1}
              - ${self:custom.publicSubnet2}
            SecurityGroups:
              - ${self:custom.zenithSecurityGroup}
        LoadBalancers:
          - ContainerName: api
            ContainerPort: 5000
            TargetGroupArn: !Ref ZenithTargetGroup

  Outputs:
    ALBEndpoint:
      Value: !GetAtt ZenithALB.DNSName
      Description: "URL of the Application Load Balancer"
